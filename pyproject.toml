[project]
name = "jobrollo"
version = "0.1.0"
description = "The agentic, local-first job-application agent. ATS-first, human-gated, runs on Ollama — never submits, never fabricates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parth Ghayal" }]
keywords = ["agentic", "ai-agent", "job-search", "ats", "greenhouse", "lever", "ashby", "ollama", "llm", "automation", "playwright"]
dependencies = [
    "playwright>=1.44",
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
jobrollo = "jobrollo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobrollo"]

[tool.hatch.build.targets.wheel.force-include]
"jobrollo/data/companies_seed.txt" = "jobrollo/data/companies_seed.txt"

[tool.ruff]
line-length = 100
