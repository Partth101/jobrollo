# ============================================================================
#  secret.example.yaml  →  copy to  secret.yaml  and fill in YOUR details.
#
#  This ONE private file holds everything LocalApply needs: which model to use,
#  who you are, the background the AI may draw on, your canonical application
#  answers, what jobs to search for, and behavior settings.
#
#  ⚠️  secret.yaml is git-ignored. NEVER commit it — it contains personal data.
# ============================================================================

# ---------------------------------------------------------------------------
# 1. MODEL — which brain runs the agent. Local (Ollama) by default: your data
#    never leaves your machine and there is no per-application cost.
# ---------------------------------------------------------------------------
llm:
  provider: ollama                 # ollama  |  openai_compatible
  base_url: http://localhost:11434
  model: qwen2.5:7b                # any local model: llama3.1:8b, qwen2.5:7b, mistral, ...
  temperature: 0.1                 # low = faithful to your data, less "creative"
  # To use a cloud model instead (optional — not the default):
  #   provider: openai_compatible
  #   base_url: https://api.openai.com/v1
  #   model: gpt-4o-mini
  #   api_key_env: OPENAI_API_KEY  # the agent reads the key from this env var

# ---------------------------------------------------------------------------
# 2. YOU — personal details used to fill application forms.
# ---------------------------------------------------------------------------
profile:
  identity:
    legal_first_name: "Jane"
    legal_middle_name: ""
    legal_last_name: "Doe"
    preferred_name: "Jane"
    email: "jane.doe@example.com"
    phone: "5551234567"
    phone_country_code: "United States (+1)"
  location:
    city: "New York"
    state: "NY"
    country: "United States"
    zip: "10001"
    willing_to_relocate: true
    work_modes: ["remote", "hybrid", "onsite"]
  work_authorization:
    authorized_us_any_employer: true
    visa_status: "F-1 OPT"
    require_sponsorship_future: true
  links:
    linkedin: "https://www.linkedin.com/in/janedoe/"
    github: "https://github.com/janedoe"
    portfolio: ""

  # Path to your résumé PDF on disk (this file itself is uploaded to each form).
  resume_path: "/Users/you/Documents/resume.pdf"

  # BACKGROUND the AI may draw on to answer open-ended questions ("Tell us about
  # a project…", "Why are you a fit?"). Write it truthfully and specifically —
  # the model is instructed to ground every generated answer ONLY in this text
  # and to flag (not invent) anything this doesn't clearly support.
  background: |
    Senior AI Engineer, 5 years. Built and shipped production LLM systems:
    an ambient clinical scribe (multi-pass LLM pipeline), pgvector RAG with
    clinical decision support, and multi-agent orchestration. Strong in Python,
    LLMs, RAG, MLOps, AWS/Azure/GCP. MS in CS-AI. Add your real, verifiable
    experience, projects, metrics, and skills here — the more concrete, the
    better the tailored answers.

# ---------------------------------------------------------------------------
# 3. ANSWERS — canonical responses to recurring application questions.
#    Set any value to ASK_HUMAN to force the agent to leave that field for you.
# ---------------------------------------------------------------------------
answers:
  authorized_to_work_us: "Yes"
  require_sponsorship_now_or_future: "Yes"
  currently_on_opt_or_h4: "Yes"
  currently_reside_us: "Yes"
  salary_expectation: "135000-160000"
  years_experience: "5"
  earliest_start: "2 weeks"
  notice_period: "2 weeks"
  how_did_you_hear: "LinkedIn"
  willing_to_relocate: "Yes"
  comfortable_remote: "Yes"
  comfortable_hybrid: "Yes"
  comfortable_onsite: "Yes"
  non_compete: "No"
  previously_worked_here: "No"
  referred_by_employee: "No"
  gender: "Decline to self-identify"
  race_ethnicity: "Decline to self-identify"
  hispanic_latino: "No"
  veteran_status: "I am not a protected veteran"
  disability_status: "I don't wish to answer"
  # Add your own. Anything you're unsure about → ASK_HUMAN (the agent flags it):
  # active_security_clearance: "ASK_HUMAN"

# ---------------------------------------------------------------------------
# 4. SEARCH — what to look for. Titles use OR semantics (match ANY).
# ---------------------------------------------------------------------------
search:
  titles: "AI Engineer OR LLM Engineer OR Machine Learning Engineer"
  locations: ["United States", "Remote"]   # empty = anywhere
  remote_ok: true
  companies: companies.txt                  # ATS boards to search (see examples/)

# ---------------------------------------------------------------------------
# 5. BEHAVIOR
# ---------------------------------------------------------------------------
browser:
  headless: false            # keep visible — you review before submitting
  slow_mo_ms: 200
  throttle_between_jobs_s: 30
runner:
  step_budget: 60            # max perceive→act steps per form before yielding to you
discovery:
  max_per_source: 20
