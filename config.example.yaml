# LocalApply configuration. Copy to config.yaml and edit.

llm:
  # Local by default. Point this at any Ollama server.
  provider: ollama
  base_url: http://localhost:11434
  model: llama3.1:8b
  temperature: 0.2          # low = faithful to your profile, less "creative"
  # To use a cloud model instead (optional, not the default), set:
  #   provider: openai_compatible
  #   base_url: https://api.openai.com/v1
  #   api_key_env: OPENAI_API_KEY

# All your personal details, résumé path, and job targets live in these files.
# Edit files, never code. See examples/ for templates.
profile: profile.json          # personal details + résumé path + EEO
answers: answers.json          # canonical screening answers (ASK_HUMAN to force a human)

# What to search for. Titles/keywords use OR semantics — write a list OR an
# "A OR B OR C" string; both mean "match ANY of these".
search:
  titles: "AI Engineer OR LLM Engineer OR Healthcare AI OR Forward Deployed Engineer OR Prompt Engineer"
  # locations: empty = anywhere. remote_ok keeps any 'Remote' posting regardless of locations.
  locations: ["United States", "Canada"]
  remote_ok: true
  companies: companies.txt      # which ATS boards to search (see examples/companies.example.txt)

browser:
  headless: false           # keep visible — you review before submitting
  slow_mo_ms: 250           # gentle pacing; be a good citizen
  throttle_between_jobs_s: 30

runner:
  # LocalApply NEVER clicks submit. This cannot be turned off.
  human_gated: true
  # If a required field can't be answered honestly, flag it instead of guessing.
  stop_on_unanswerable_required: true
  # Max perceive→act steps the agent takes per form before yielding to you.
  step_budget: 60

discovery:
  sources: [greenhouse, lever, ashby]   # public ATS boards only
  max_per_source: 20
